<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bukaake Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/main.css">
  <style>
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background: transparent !important;
    }

    body {
      width: 100%;
      height: 100%;
      overflow: hidden !important;
      margin: 0;
      padding: 0;
      background: var(--glass-panel-bg) !important;
      border-radius: var(--radius-md);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      display: flex;
      flex-direction: column;
      box-shadow: var(--glass-shadow);
    }

    .settings-window-shell {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius-md);
      background: transparent;
      border: none !important;
      box-shadow: none !important;
      overflow: hidden;
    }

    .settings-titlebar-drag {
      height: 44px;
      padding: 0 12px 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: none !important;
      background: linear-gradient(180deg, var(--glass-titlebar-bg) 0%, var(--glass-titlebar-fade) 100%);
      border-top-left-radius: var(--radius-md);
      border-top-right-radius: var(--radius-md);
      -webkit-app-region: drag;
      app-region: drag;
    }

    .settings-title-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .settings-win-logo {
      width: 26px;
      height: 26px;
      border-radius: var(--radius-sm);
      background: var(--glass-bg-hover);
      border: none !important;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--text-main);
    }

    .settings-win-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .settings-win-version {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-dim);
    }

    .settings-win-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      -webkit-app-region: no-drag;
      app-region: no-drag;
    }

    .settings-win-btn {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all var(--transition-fast);
    }

    .settings-win-btn:focus,
    .settings-win-btn:focus-visible {
      outline: none !important;
      box-shadow: none !important;
    }

    .settings-win-btn:hover {
      background: var(--glass-bg-hover);
      color: var(--text-main);
    }

    .settings-win-btn.close:hover {
      background: #e81123 !important;
      color: #ffffff !important;
    }

    .settings-content-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .settings-window-footer {
      padding: 10px 18px;
      border-top: none !important;
      border-bottom-left-radius: var(--radius-md);
      border-bottom-right-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="glass-theme dark">
  <div class="settings-window-shell">
    <div class="settings-titlebar-drag" data-tauri-drag-region>
      <div class="settings-title-left" data-tauri-drag-region>
        <div class="settings-win-logo">
          <i class="ri-settings-3-line"></i>
        </div>
        <span class="settings-win-title" data-tauri-drag-region>Bukaake Settings</span>
        <span class="settings-win-version" data-tauri-drag-region>v0.1.0</span>
      </div>
      <div class="settings-win-controls">
        <button class="settings-win-btn close" id="btnCloseWindow" title="Close (Esc)">
          <i class="ri-close-line"></i>
        </button>
      </div>
    </div>

    <div class="settings-content-scroll">
      <!-- Bio / About Card -->
      <div class="settings-bio-card">
        <p class="settings-desc">
          Lightweight, distraction-free & portable Windows image viewer crafted with native Windows frosted glass.
        </p>
        <div class="settings-author-row">
          <span>Made with</span>
          <i class="ri-heart-3-line icon-author-heart"></i>
          <span>by</span>
          <a href="https://kaleksananbagus.com" target="_blank" class="settings-author-link">Kaleksanan Bagus</a>
        </div>
        <div class="settings-coffee-row">
          <span class="coffee-label"><i class="ri-cup-line"></i> Buy me a coffee:</span>
          <a href="https://saweria.co/curlyzed" target="_blank" class="coffee-chip"><span>Saweria</span> <i class="ri-arrow-right-up-line"></i></a>
          <a href="https://paypal.me/BagusMassani" target="_blank" class="coffee-chip"><span>PayPal</span> <i class="ri-arrow-right-up-line"></i></a>
        </div>
      </div>

      <!-- Update Banner -->
      <div class="settings-update-banner">
        <div class="update-status-wrap">
          <i class="ri-checkbox-circle-line"></i>
          <span id="updateStatusText">Bukaake v0.1.0 (Latest Version)</span>
        </div>
        <button class="btn-check-update" id="btnCheckUpdate"><i class="ri-refresh-line"></i> Check</button>
      </div>

      <!-- Report Bug Action -->
      <div class="settings-actions-grid">
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSciTFA6rWYPq98UwqOvJgLnqGh5P71Vcz5d2GPVdne9Tz34WA/viewform" target="_blank" class="settings-action-btn" id="btnReportBug">
          <i class="ri-bug-line"></i> Report Bug / Feature <i class="ri-arrow-right-up-line"></i>
        </a>
      </div>
    </div>

    <div class="settings-window-footer">
      <span>Engine: Tauri v2 • Rust Tokio</span>
      <span>Webview2 & Vanilla JS</span>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script type="module" src="/src/settings-app.js"></script>
</body>
</html>
