[package]
name = "bukaake"
version = "0.3.0"
description = "Bukaake — Lightweight Glass Image Viewer"
authors = ["Bukaake Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25.0"
base64 = "0.22"
window-vibrancy = "0.6.0"
rfd = "0.15"
arboard = "3.4"
self-replace = "1.5.0"
kamadak-exif = "0.6"
winreg = "0.52"
heif-oxide = "0.1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
] }
